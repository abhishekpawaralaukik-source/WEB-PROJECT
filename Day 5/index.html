<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <aside class="sidebar">

            <div class="sidebar-header">
                <h2>Task Manager</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="active">Dashboard</a>
                <a href="#">Tasks</a>
                <a href="#">Logout</a>
            </nav>

        </aside>


        <main class="main-content">

            <section class="welcome-section">
                <h1>Welcome back!</h1>
                <p>Here's an overview of your tasks.</p>
            </section>


            <section class="stats-section">

                <div class="stat-card">
                    <h3>Total Tasks</h3>
                    <p>12</p>
                </div>

                <div class="stat-card">
                    <h3>Completed</h3>
                    <p>7</p>
                </div>

                <div class="stat-card">
                    <h3>Pending</h3>
                    <p>5</p>
                </div>

            </section>

        </main>

    </div>

</body>
</html>
